<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1A" media="(prefers-color-scheme: dark)">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#1D2B2A; --muted:#5F6F6C; --line:#D5DCD6;
  --accent:#2B6E8A; --on-accent:#FFFFFF; --done:#2F8A5B; --streak:#A8690F;
  --rest:#4E57A0; --rest-bg:#DFE2F2;
  --radius-lg:18px; --radius-sm:10px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141A1A; --surface:#1D2524; --ink:#E6ECE9; --muted:#9AA8A5; --line:#2E3937;
    --accent:#6FB3CF; --on-accent:#0E1A1F; --done:#53B882; --streak:#E3A64A;
    --rest:#B4BAEC; --rest-bg:#2B3150;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 110px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.top h1{font-size:2.3rem;line-height:1.05;font-weight:750;letter-spacing:-.02em}
.top p{font-size:1rem;margin-bottom:2px}
.bar{align-items:center;margin-bottom:18px}
.bar h2{font-size:1.15rem;font-weight:650;flex:1}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.icon:active{background:var(--line)}
.icon svg{width:24px;height:24px}
.summary{color:var(--muted);margin:4px 0 18px}

.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);font-size:.93rem}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--radius-lg);padding:14px 14px 14px 16px}
.check{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.check svg{width:24px;height:24px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
.row.done .check{background:var(--done);border-color:var(--done);color:#fff}
.row.done .check svg{opacity:1;transform:scale(1)}
.row.rest .check{border-color:var(--rest);border-style:dashed;color:var(--rest)}
.restlabel{color:var(--rest);font-weight:600}
.rowbody{flex:1;min-width:0;text-align:left;display:grid;gap:5px}
.name{font-size:1.08rem;font-weight:620;overflow-wrap:anywhere}
.meta{font-size:.88rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tag{font-size:.78rem;padding:1px 8px;border-radius:6px;background:var(--bg);color:var(--ink)}
.streak{color:var(--streak);font-weight:600}
.strip{display:flex;gap:4px;margin-top:2px}
.strip i{font-style:normal;font-size:.68rem;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.strip i.on{background:var(--done);color:#fff}
.strip i.rest{background:var(--rest-bg);color:var(--rest)}
.strip i.now{box-shadow:inset 0 0 0 1.5px var(--ink)}

.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;gap:6px;align-items:center;background:var(--accent);color:var(--on-accent);padding:14px 22px 14px 18px;border-radius:999px;font-weight:650;box-shadow:0 6px 18px rgba(20,40,50,.25)}
.fab svg{width:22px;height:22px}

/* detail */
.title{font-size:1.9rem;font-weight:750;letter-spacing:-.015em;line-height:1.1;overflow-wrap:anywhere}
.sub{color:var(--muted);margin:6px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--surface);border-radius:var(--radius-sm);padding:12px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.hot b{color:var(--streak)}
.panel{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
.panel h3{font-size:1rem;font-weight:650;margin-bottom:10px}
.instructions{white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
.instructions a{color:var(--accent)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h3{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:.75rem;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;position:relative;font-variant-numeric:tabular-nums;font-size:.95rem}
.day.on{background:var(--done);color:#fff}
.day.rest{background:var(--rest-bg);color:var(--rest);font-weight:600}
.day.now{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{outline:3px solid var(--accent);outline-offset:1px}
.day:disabled{opacity:.35;cursor:default}
.day .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.selday{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 12px;margin-bottom:10px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:10px 16px;border-radius:999px;border:2px solid var(--done);color:var(--done);font-weight:620;flex:none}
.pill.on{background:var(--done);color:#fff}
.pill.restpill{border-color:var(--rest);color:var(--rest)}
.pill.restpill.on{background:var(--rest);border-color:var(--rest);color:var(--surface)}
.pill:disabled{opacity:.45;cursor:default}
.resthint{font-size:.85rem;color:var(--muted);margin:-2px 0 10px}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:12px;font-size:1rem}
textarea{resize:vertical;line-height:1.5}
.danger{color:#B3261E;padding:14px 0;font-weight:600}
@media (prefers-color-scheme: dark){.danger{color:#F2B8B5}}

/* form */
.form{display:flex;flex-direction:column;gap:18px}
.form label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95rem}
.hint{font-size:.85rem;color:var(--muted);font-weight:400}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:600;font-size:.95rem;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:var(--radius-sm);padding:4px;gap:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px;border-radius:7px;cursor:pointer}
.seg input:checked + span{background:var(--ink);color:var(--bg);font-weight:600}
.seg input:focus-visible + span{outline:3px solid var(--accent)}
.primary{background:var(--accent);color:var(--on-accent);padding:15px;border-radius:999px;font-weight:650;font-size:1.05rem}
.secondary{border:2px solid var(--line);padding:13px;border-radius:999px;font-weight:600;width:100%}
.stack{display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.93rem;max-width:90vw;z-index:10}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORE = 'habit-tracker-v1';
const BACKUP_KEY = 'habit-tracker-lastbackup';

const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:1;transform:none"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>'
};

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = d => addDays(d, -((d.getDay()+6)%7)); // Monday
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;

/* ---------- storage ---------- */
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && Array.isArray(s.habits)) return { habits:s.habits, logs:s.logs || {} };
  }catch(e){}
  return { habits:[], logs:{} };
}
let state = load();
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }
  catch(e){ toast('Could not save. Phone storage may be full.'); }
}

/* ---------- logic ---------- */
const entry = (h,k) => state.logs[h.id]?.[k];
const isDone = (h,d) => !!entry(h, key(d))?.d;
const REST_PER_WEEK = 2;
// Rest days only apply to "Every day" habits; weekly-target habits already allow days off.
const isRest = (h,d) => !h.target && !entry(h, key(d))?.d && !!entry(h, key(d))?.r;
function setEntry(h,k,patch){
  const L = state.logs[h.id] || (state.logs[h.id] = {});
  const e = { ...(L[k]||{}), ...patch };
  if (e.d) e.r = 0;                       // a done day can't also be a rest day
  if (!e.r) delete e.r;
  if (!e.d && !e.n && !e.r) delete L[k]; else L[k] = e;
  save();
}
function toggle(h,d){ const k = key(d); setEntry(h, k, { d: entry(h,k)?.d ? 0 : 1 }); }
function weekCount(h,ws){ let c=0; for(let i=0;i<7;i++) if(isDone(h, addDays(ws,i))) c++; return c; }
// Rest days used in the Mon–Sun week containing d (optionally ignoring one date)
function restCount(h,d,exceptKey){
  const ws = weekStart(d); let c = 0;
  for (let i=0;i<7;i++){ const x = addDays(ws,i); if (key(x)!==exceptKey && isRest(h,x)) c++; }
  return c;
}
const canRest = (h,d) => !h.target && (isRest(h,d) || restCount(h,d,key(d)) < REST_PER_WEEK);
function toggleRest(h,d){
  const k = key(d);
  if (isRest(h,d)){ setEntry(h, k, { r:0 }); return true; }
  if (!canRest(h,d)){ toast(`You've already used ${REST_PER_WEEK} rest days that week.`); return false; }
  setEntry(h, k, { d:0, r:1 }); return true;
}
function streak(h){
  const t = today();
  if (!h.target){
    // Count done days back from today. Rest days keep the streak alive but don't add to it.
    // If today isn't logged yet, start from yesterday so the streak isn't lost mid-day.
    let d = (isDone(h,t) || isRest(h,t)) ? t : addDays(t,-1), n = 0;
    for (let g=0; g<3660; g++){
      if (isDone(h,d)) n++;
      else if (!isRest(h,d)) break;
      d = addDays(d,-1);
    }
    return n;
  }
  let w = weekStart(t), n = 0;
  if (weekCount(h,w) >= h.target) n++;   // this week counts once met
  w = addDays(w,-7);
  for (let g=0; g<520 && weekCount(h,w) >= h.target; g++){ n++; w = addDays(w,-7); }
  return n;
}
const schedule = h => h.target ? `${h.target}× a week` : 'Every day';
const streakText = h => { const n = streak(h); return h.target ? plural(n,'week') : plural(n,'day'); };

/* ---------- navigation (works with Android back button) ---------- */
const ui = { view:'today', habitId:null, filter:'all', month:null, selDate:null, editId:null };
function go(view, params={}){ Object.assign(ui, {view}, params); history.pushState({...ui}, ''); render(); scrollTo(0,0); }
function replace(){ history.replaceState({...ui}, ''); }
window.addEventListener('popstate', e => { Object.assign(ui, e.state || {view:'today'}); render(); });

/* ---------- views ---------- */
function viewToday(){
  const t = today(), ws = weekStart(t);
  const list = state.habits.filter(h => ui.filter==='all' || h.kind===ui.filter);
  const doneToday = state.habits.filter(h => isDone(h,t)).length;
  const letters = ['M','T','W','T','F','S','S'];
  return `
  <header class="top">
    <div>
      <p class="muted">${t.toLocaleDateString('en-AU',{weekday:'long'})}</p>
      <h1>${t.toLocaleDateString('en-AU',{day:'numeric',month:'long'})}</h1>
    </div>
    <button class="icon" data-act="settings" aria-label="Backup">${ICON.save}</button>
  </header>
  ${state.habits.length ? `<p class="summary">${doneToday} of ${state.habits.length} done today</p>` : '<p class="summary">&nbsp;</p>'}
  ${state.habits.length ? `<div class="chips">${['all','habit','exercise'].map(f =>
    `<button class="chip ${ui.filter===f?'on':''}" data-act="filter" data-f="${f}" aria-pressed="${ui.filter===f}">${{all:'All',habit:'Habits',exercise:'Exercises'}[f]}</button>`).join('')}</div>` : ''}
  <ul class="list">
  ${list.map(h => {
    const done = isDone(h,t), rest = isRest(h,t), n = streak(h), used = h.target ? 0 : restCount(h,t);
    const meta = h.target ? `${weekCount(h,ws)} of ${h.target} this week`
      : rest ? `<span class="restlabel">Rest day</span>`
      : `Every day${used ? ` · ${used} of ${REST_PER_WEEK} rest days used` : ''}`;
    return `<li class="row ${done?'done':''} ${rest?'rest':''}">
      <button class="check" data-act="toggle" data-id="${h.id}" aria-pressed="${done}" aria-label="Mark ${esc(h.name)} done today${rest?' (currently a rest day)':''}">${rest ? ICON.moon : ICON.check}</button>
      <button class="rowbody" data-act="open" data-id="${h.id}">
        <span class="name">${esc(h.name)}</span>
        <span class="meta">${h.kind==='exercise'?'<span class="tag">Exercise</span>':''}<span>${meta}</span>${n?`<span class="streak">${streakText(h)} streak</span>`:''}</span>
        <span class="strip" aria-hidden="true">${letters.map((l,i) => { const d = addDays(ws,i);
          return `<i class="${isDone(h,d)?'on':''} ${isRest(h,d)?'rest':''} ${key(d)===key(t)?'now':''}">${l}</i>`; }).join('')}</span>
      </button>
    </li>`;
  }).join('')}
  </ul>
  ${!list.length ? `<div class="empty"><p>${state.habits.length ? 'Nothing in this list yet.' : 'Add a habit or exercise to start tracking.'}</p></div>` : ''}
  <button class="fab" data-act="new">${ICON.plus}Add</button>`;
}

function viewDetail(){
  const h = state.habits.find(x => x.id===ui.habitId);
  if (!h){ ui.view='today'; return viewToday(); }
  const t = today(), tk = key(t);
  const m = ui.month ? new Date(ui.month) : new Date(t.getFullYear(), t.getMonth(), 1);
  const sel = ui.selDate || tk, selD = fromKey(sel), e = entry(h, sel) || {};
  const lead = (new Date(m.getFullYear(), m.getMonth(), 1).getDay()+6)%7;
  const dim = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  let monthDone = 0, cells = '';
  for (let i=0;i<lead;i++) cells += '<span></span>';
  for (let d=1; d<=dim; d++){
    const date = new Date(m.getFullYear(), m.getMonth(), d), k = key(date), en = entry(h,k) || {};
    if (en.d) monthDone++;
    const r = isRest(h,date);
    cells += `<button class="day ${en.d?'on':''} ${r?'rest':''} ${k===tk?'now':''} ${k===sel?'sel':''}" data-act="day" data-k="${k}" ${date>t?'disabled':''}
      aria-label="${date.toLocaleDateString('en-AU',{day:'numeric',month:'long'})}${en.d?', done':''}${r?', rest day':''}${en.n?', has note':''}">${d}${en.n?'<span class="dot"></span>':''}</button>`;
  }
  const isThisMonth = m.getFullYear()===t.getFullYear() && m.getMonth()===t.getMonth();
  const selLabel = sel===tk ? 'Today' : selD.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  const n = streak(h);
  return `
  <header class="top bar">
    <button class="icon" data-act="back" aria-label="Back">${ICON.back}</button>
    <h2></h2>
    <button class="icon" data-act="edit" aria-label="Edit">${ICON.edit}</button>
  </header>
  <h1 class="title">${esc(h.name)}</h1>
  <p class="sub">${h.kind==='exercise' ? `Exercise, ${schedule(h).toLowerCase()}` : schedule(h)}</p>
  <div class="stats">
    <div class="stat ${n?'hot':''}"><b>${n}</b><span>${h.target?'Week':'Day'} streak</span></div>
    <div class="stat"><b>${weekCount(h,weekStart(t))}${h.target?`/${h.target}`:''}</b><span>This week</span></div>
    <div class="stat"><b>${monthDone}</b><span>In ${m.toLocaleDateString('en-AU',{month:'short'})}</span></div>
  </div>
  ${h.instructions ? `<section class="panel"><h3>Instructions</h3><div class="instructions">${linkify(h.instructions)}</div></section>` : ''}
  <section class="panel">
    <div class="cal-head">
      <button class="icon" data-act="month" data-dir="-1" aria-label="Previous month">${ICON.back}</button>
      <h3>${m.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</h3>
      <button class="icon" data-act="month" data-dir="1" aria-label="Next month" ${isThisMonth?'disabled style="opacity:.3"':''}>${ICON.next}</button>
    </div>
    <div class="cal">${['M','T','W','T','F','S','S'].map(l=>`<span class="dow">${l}</span>`).join('')}${cells}</div>
  </section>
  <section class="panel">
    <div class="selday">
      <h3 style="margin:0">${selLabel}</h3>
      <div class="pills">
        <button class="pill ${e.d?'on':''}" data-act="toggleSel" aria-pressed="${!!e.d}">${e.d?'Done':'Mark done'}</button>
        ${h.target ? '' : (() => { const r = isRest(h,selD), ok = canRest(h,selD);
          return `<button class="pill restpill ${r?'on':''}" data-act="restSel" aria-pressed="${r}" ${ok?'':'disabled'}>Rest day</button>`; })()}
      </div>
    </div>
    ${h.target ? '' : (() => { const used = restCount(h,selD);
      return `<p class="resthint">${used} of ${REST_PER_WEEK} rest days used ${weekStart(selD).getTime()===weekStart(t).getTime()?'this week':'that week'}. Rest days keep your streak going.</p>`; })()}
    <textarea id="note" rows="3" placeholder="${h.kind==='exercise'?'Weights, reps, how it felt…':'Notes for this day…'}">${esc(e.n)}</textarea>
  </section>
  <button class="danger" data-act="delete">Delete ${h.kind==='exercise'?'exercise':'habit'}</button>`;
}

function viewEdit(){
  const h = state.habits.find(x => x.id===ui.editId) || { name:'', kind:'habit', target:0, instructions:'' };
  const opts = [0,1,2,3,4,5,6].map(v => `<option value="${v}" ${h.target===v?'selected':''}>${v ? `${v}× a week` : 'Every day'}</option>`).join('');
  return `
  <header class="top bar">
    <button class="icon" data-act="back" aria-label="Cancel">${ICON.back}</button>
    <h2>${ui.editId ? 'Edit' : 'New'}</h2>
  </header>
  <div class="form">
    <label class="field">Name
      <input type="text" id="f-name" value="${esc(h.name)}" maxlength="60" placeholder="e.g. Morning walk, Push-ups" autocomplete="off">
    </label>
    <fieldset><legend>Type</legend>
      <div class="seg">
        <label><input type="radio" name="kind" value="habit" ${h.kind!=='exercise'?'checked':''}><span>Habit</span></label>
        <label><input type="radio" name="kind" value="exercise" ${h.kind==='exercise'?'checked':''}><span>Exercise</span></label>
      </div>
    </fieldset>
    <label class="field">How often
      <select id="f-target">${opts}</select>
    </label>
    <label class="field">Instructions
      <textarea id="f-ins" rows="8" placeholder="3 sets of 12&#10;Keep back straight&#10;Rest 60 seconds between sets">${esc(h.instructions)}</textarea>
      <span class="hint">Optional. Steps, sets and reps, form cues, or a video link.</span>
    </label>
    <button class="primary" data-act="save">Save</button>
  </div>`;
}

function viewSettings(){
  const last = localStorage.getItem(BACKUP_KEY);
  return `
  <header class="top bar">
    <button class="icon" data-act="back" aria-label="Back">${ICON.back}</button>
    <h2>Backup</h2>
  </header>
  <section class="panel">
    <p style="line-height:1.55;margin-bottom:14px">Your habits are stored only on this phone. Clearing Chrome's data or uninstalling the app deletes them, so save a backup now and then.</p>
    <p class="muted" style="margin-bottom:16px">${last ? `Last backup: ${new Date(last).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}` : 'No backup saved yet.'}</p>
    <div class="stack">
      <button class="primary" data-act="export">Save backup file</button>
      <button class="secondary" data-act="import">Restore from backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>`;
}

/* ---------- render & events ---------- */
const app = document.getElementById('app');
function render(){
  app.innerHTML = ({today:viewToday, detail:viewDetail, edit:viewEdit, settings:viewSettings}[ui.view] || viewToday)();
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const h = state.habits.find(x => x.id === (b.dataset.id || ui.habitId));
  switch (b.dataset.act){
    case 'toggle': toggle(h, today()); navigator.vibrate?.(12); render(); break;
    case 'open': go('detail', {habitId:h.id, month:null, selDate:null}); break;
    case 'new': go('edit', {editId:null}); break;
    case 'edit': go('edit', {editId:ui.habitId}); break;
    case 'settings': go('settings'); break;
    case 'back': history.back(); break;
    case 'filter': ui.filter = b.dataset.f; replace(); render(); break;
    case 'month': {
      const t = today(), m = ui.month ? new Date(ui.month) : new Date(t.getFullYear(), t.getMonth(), 1);
      m.setMonth(m.getMonth() + Number(b.dataset.dir)); ui.month = m; replace(); render(); break;
    }
    case 'day': ui.selDate = b.dataset.k; replace(); render(); break;
    case 'toggleSel': toggle(h, fromKey(ui.selDate || key(today()))); render(); break;
    case 'restSel': if (toggleRest(h, fromKey(ui.selDate || key(today())))){ navigator.vibrate?.(12); render(); } break;
    case 'save': saveForm(); break;
    case 'delete':
      if (confirm(`Delete "${h.name}" and all its history? This can't be undone.`)){
        state.habits = state.habits.filter(x => x.id !== h.id); delete state.logs[h.id]; save(); history.back();
      } break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
  }
});

app.addEventListener('input', ev => {
  if (ev.target.id === 'note'){
    const h = state.habits.find(x => x.id===ui.habitId);
    if (h) setEntry(h, ui.selDate || key(today()), { n: ev.target.value });
  }
});

app.addEventListener('change', ev => {
  if (ev.target.id === 'importFile' && ev.target.files[0]) importData(ev.target.files[0]);
});

function saveForm(){
  const name = document.getElementById('f-name').value.trim();
  if (!name){ toast('Enter a name first.'); document.getElementById('f-name').focus(); return; }
  const data = {
    name,
    kind: document.querySelector('input[name=kind]:checked').value,
    target: Number(document.getElementById('f-target').value),
    instructions: document.getElementById('f-ins').value.trim()
  };
  const existing = state.habits.find(x => x.id===ui.editId);
  if (existing) Object.assign(existing, data);
  else state.habits.push({ id:uid(), created:key(today()), ...data });
  save(); history.back();
}

function exportData(){
  const blob = new Blob([JSON.stringify({app:'habits', version:1, exported:new Date().toISOString(), ...state}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `habits-backup-${key(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  localStorage.setItem(BACKUP_KEY, new Date().toISOString());
  toast('Backup saved to Downloads.'); render();
}

function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.habits) || typeof d.logs !== 'object') throw 0;
      if (!confirm(`Replace everything on this phone with ${plural(d.habits.length,'item')} from the backup?`)) return;
      state = { habits:d.habits, logs:d.logs || {} }; save();
      toast('Backup restored.'); history.back();
    }catch(e){ toast('That file isn\'t a habits backup.'); }
  };
  r.readAsText(file);
}

let toastTimer;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className='toast'; el.role='status'; el.textContent=msg;
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

// Refresh when the app is reopened on a new day
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.activeElement?.matches('textarea,input')) render(); });

history.replaceState({...ui}, '');
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
navigator.storage?.persist?.();
</script>
</body>
</html>
